<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Segunda Mente · Captura</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,520px)}.eyebrow{opacity:.55;font-size:13px;letter-spacing:.08em;text-transform:uppercase}h1{font-size:32px;line-height:1.05;margin:12px 0 22px}textarea{width:100%;min-height:150px;resize:none;border:1px solid #2b2e38;border-radius:22px;background:#151820;color:#fff;padding:18px;font:inherit;font-size:18px;outline:none}textarea:focus{border-color:#777d90}.actions{display:grid;grid-template-columns:1fr 64px;gap:10px;margin-top:12px}button{border:0;border-radius:18px;min-height:58px;font:inherit;font-weight:650}.send{background:#f5f6fa;color:#0b0d12}.mic{background:#20242e;color:white;font-size:24px}.mic.on{outline:2px solid #fff}.hint,.status{font-size:13px;opacity:.58;margin-top:14px;line-height:1.45}.status{min-height:20px}.ok{opacity:1;color:#b8f5ca}</style></head><body><main class="card"><div class="eyebrow">Segunda Mente</div><h1>¿Qué tienes en mente?</h1><textarea id="input" autofocus placeholder="Escribe algo…  ·  18,50 cena  ·  mañana llamar al taller  ·  idea: …"></textarea><div class="actions"><button class="send" id="send">Guardar</button><button class="mic" id="mic" aria-label="Hablar">🎙️</button></div><div class="status" id="status"></div><div class="hint">Escribe o habla. No tienes que elegir antes si es un gasto, una tarea, una idea o una nota.</div></main><script>
const input=document.querySelector('#input'),status=document.querySelector('#status'),mic=document.querySelector('#mic');
const qs=new URLSearchParams(location.search); if(qs.get('text')) input.value=qs.get('text');
function parse(text){const t=text.trim();const amount=t.match(/(?:€\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:€|euros?)?/i);const expense=/\b(gast|pag|compr|cena|comida|gasolina|supermerc|mercadona)\w*/i.test(t);const income=/\b(cobrad|ingres|nomina|nómina)\w*/i.test(t);const task=/\b(recu[eé]rd|mañana|llamar|hacer|tarea)\b/i.test(t);const idea=/\bidea\b/i.test(t);return {id:crypto.randomUUID?.()||String(Date.now()),text:t,created_at:new Date().toISOString(),kind:income?'income':expense?'expense':task?'task':idea?'idea':'note',amount:amount?Number(amount[1].replace(',','.')):null,source:'universal_capture'} }
function save(){const text=input.value.trim();if(!text)return;const item=parse(text);const all=JSON.parse(localStorage.getItem('segunda_mente_captures')||'[]');all.unshift(item);localStorage.setItem('segunda_mente_captures',JSON.stringify(all));if(item.kind==='expense'||item.kind==='income'){const moves=JSON.parse(localStorage.getItem('segunda_mente_movements')||'[]');moves.unshift(item);localStorage.setItem('segunda_mente_movements',JSON.stringify(moves));}status.textContent='✓ Guardado en Segunda Mente';status.className='status ok';input.value='';setTimeout(()=>{status.textContent='';status.className='status'},1800)}
document.querySelector('#send').onclick=save;input.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')save()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang='es-ES';r.interimResults=true;r.continuous=false;r.onstart=()=>{mic.classList.add('on');status.textContent='Escuchando…'};r.onresult=e=>{input.value=Array.from(e.results).map(x=>x[0].transcript).join('')};r.onend=()=>{mic.classList.remove('on');status.textContent=input.value?'Pulsa Guardar para confirmar':''};r.onerror=()=>{mic.classList.remove('on');status.textContent='No pude usar el micrófono. Puedes escribir.'};mic.onclick=()=>r.start()}else{mic.onclick=()=>{status.textContent='Usa el dictado 🎙️ del teclado del iPhone para hablar.'}}
</script></body></html>
