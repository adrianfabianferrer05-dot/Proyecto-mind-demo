<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0e10"><title>Capturar · Segunda Mente</title><style>:root{--bg:#0d0e10;--card:#17191e;--ink:#f7f5f0;--muted:#9b9ca3;--line:#ffffff16;--accent:#d7ff64}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#24282f,#0d0e10 55%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;min-height:100vh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px)}main{width:min(100%,500px)}.brand{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:28px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px #d7ff6488;margin-right:8px}h1{font-size:42px;line-height:.95;letter-spacing:-.05em;margin:0 0 12px}.sub{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:20px}.card{border:1px solid var(--line);background:#17191edd;backdrop-filter:blur(18px);border-radius:24px;padding:18px}textarea{width:100%;min-height:120px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:17px;line-height:1.45}button{width:100%;border:0;border-radius:17px;padding:15px;font:inherit;font-weight:800;margin-top:10px;background:var(--accent);color:#111}.result{display:none;margin-top:12px}.result.show{display:block;animation:in .35s ease}.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border:0}.row span{color:var(--muted)}.ok{font-size:24px;font-weight:800;margin-bottom:6px}.back{background:#ffffff0d;color:var(--ink)}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style></head><body><main><div class="brand"><span class="dot"></span>SEGUNDA MENTE · CAPTURA RÁPIDA</div><section id="entry"><h1>Dímelo.<br>Yo lo guardo.</h1><div class="sub">Pensado para Atajos, botón Acción y dictado del iPhone.</div><div class="card"><textarea id="text" placeholder="Ej.: He pagado 16,40 € en Mercadona"></textarea></div><button onclick="capture()">Guardar</button></section><section id="result" class="card result"><div class="ok">Hecho.</div><div class="sub" id="summary">Guardado en tu Segunda Mente.</div><div id="details"></div><button class="back" onclick="location.href='./'">Abrir Segunda Mente</button></section></main><script>const KEY='segunda_mente_v1';function load(){try{return JSON.parse(localStorage.getItem(KEY))||{mem:[],tx:[],balance:null}}catch{return{mem:[],tx:[],balance:null}}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function typeOf(s){s=s.toLowerCase();if(/€|euro|gast|pag|compr|cobr|saldo|dinero|tarjeta|gasolina|supermercado|mercadona/.test(s))return'finanzas';if(/recu[eé]rd|tarea|hacer|llamar|cita|pendiente|mañana|sábado|domingo/.test(s))return'tarea';if(/idea|podr[ií]a|proyecto|crear|invent/.test(s))return'idea';return'nota'}function money(s){const m=s.match(/(?:€\s*)?(\d{1,6}(?:[.,]\d{1,2})?)\s*(?:€|euros?|eur)?/i);if(!m||!/(?:€|euros?|eur|gast|pag|compr|cobr|gasolina|supermercado|mercadona)/i.test(s))return null;return Number(m[1].replace(',','.'))}function label(s){let x=s.replace(/\b(?:he\s+)?(?:gastado|pagado|comprado|gasté|pagué)\b/ig,'').replace(/\d{1,6}(?:[.,]\d{1,2})?\s*(?:€|euros?|eur)?/ig,'').replace(/\b(?:en|de|por)\b/i,'').trim();return x?x.charAt(0).toUpperCase()+x.slice(1):'Gasto'}function capture(){const el=document.getElementById('text'),t=el.value.trim();if(!t)return el.focus();const s=load(),kind=typeOf(t),at=Date.now();s.mem.unshift({id:at,text:t,type:kind,at});const amount=kind==='finanzas'?money(t):null;if(amount!==null){const income=/cobrado|ingreso|nómina|nomina|me han pagado/i.test(t),signed=income?amount:-amount;s.tx.unshift({label:label(t),amount:signed,at,source:'iphone_shortcut'});if(s.balance!=null)s.balance+=signed}save(s);document.getElementById('entry').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('summary').textContent=amount!==null?'Movimiento registrado y memoria actualizada.':'Captura guardada y clasificada.';document.getElementById('details').innerHTML='<div class="row"><span>Tipo</span><b>'+kind+'</b></div>'+(amount!==null?'<div class="row"><span>Importe</span><b>'+amount.toLocaleString('es-ES',{style:'currency',currency:'EUR'})+'</b></div>':'')+'<div class="row"><span>Origen</span><b>iPhone</b></div>'}const p=new URLSearchParams(location.search);const incoming=p.get('text')||p.get('capture')||p.get('q');if(incoming){text.value=incoming;capture()}</script></body></html>
