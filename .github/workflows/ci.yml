name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check
      - run: npm test
      # Las migraciones tienen que levantar el esquema que hay en produccion, no uno
      # parecido: se aplican contra un Postgres vacio y se compara la huella.
      - run: npm run schema
      # La auditoria de interfaz necesita un navegador de verdad: es la unica forma
      # de comprobar que una hoja abre, que una fila cambia de dia, que el microfono
      # se suelta al terminar y que nada mide menos de 44 px en un iPhone.
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:ui
