name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
