<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0c"><title>Conectando banco · Segunda Mente</title><style>body{margin:0;background:#090a0c;color:#f5f3ee;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center}main{max-width:440px;padding:32px;text-align:center}.dot{width:14px;height:14px;border-radius:50%;background:#caff58;margin:0 auto 18px;box-shadow:0 0 28px #caff58}h1{font-family:Georgia,serif;font-size:34px}p{color:#9da3a8}.err{color:#ff8a8a}.ok{color:#caff58}.btn{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:12px;background:#caff58;color:#090a0c;text-decoration:none;font-weight:800;font-size:13px}</style></head><body><main><div class="dot"></div><h1>Conectando Cajamar</h1><p id="msg">Terminando la autorización…</p><a class="btn" id="back" href="./" style="display:none">Abrir Segunda Mente</a></main><script>(async()=>{const msg=document.getElementById('msg'),back=document.getElementById('back');const search=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.replace(/^#/,''));const get=k=>search.get(k)||hash.get(k)||'';const code=get('code'),state=get('state'),error=get('error'),errorDescription=get('error_description');if(error){msg.className='err';msg.textContent=errorDescription||'La autorización fue cancelada o rechazada.';back.style.display='inline-block';return}if(!code){msg.className='err';msg.textContent='Enable Banking no devolvió el código de autorización. Vuelve a Segunda Mente y repite la conexión.';back.style.display='inline-block';return}try{const r=await fetch('https://dabzmzwnvzoeywyflkoo.supabase.co/functions/v1/bank-callback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state})});const out=await r.json().catch(()=>({}));if(!r.ok)throw new Error(out.detail||out.error||'No pude terminar la conexión');msg.className='ok';msg.textContent='Cajamar conectado. Ya puedes volver a Segunda Mente.';back.style.display='inline-block'}catch(e){msg.className='err';msg.textContent=e.message||'No pude terminar la conexión.';back.style.display='inline-block'}})();</script></body></html>
