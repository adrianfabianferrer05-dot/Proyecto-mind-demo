<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0c"><title>Conectando banco · Segunda Mente</title><style>body{margin:0;background:#090a0c;color:#f5f3ee;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center}main{max-width:440px;padding:32px;text-align:center}.dot{width:14px;height:14px;border-radius:50%;background:#caff58;margin:0 auto 18px;box-shadow:0 0 28px #caff58}h1{font-family:Georgia,serif;font-size:34px}p{color:#9da3a8}.err{color:#ff8a8a}</style></head><body><main><div class="dot"></div><h1>Conectando Cajamar</h1><p id="msg">Terminando la autorización…</p></main><script>(async()=>{const msg=document.getElementById('msg'),token=localStorage.getItem('sm_device_token')||'',q=new URLSearchParams(location.search),code=q.get('code')||'',state=q.get('state')||'',error=q.get('error')||'';if(error){msg.className='err';msg.textContent='La autorización fue cancelada o rechazada.';return}if(!token||!code||!state){msg.className='err';msg.textContent='Faltan datos para terminar la conexión.';return}try{const r=await fetch('https://dabzmzwnvzoeywyflkoo.supabase.co/functions/v1/bank',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action:'authorize',code,state})});const out=await r.json().catch(()=>({}));if(!r.ok)throw new Error(out.detail||out.error||'No pude terminar la conexión');msg.textContent='Banco conectado. Volviendo a Segunda Mente…';setTimeout(()=>location.replace('./conectar-banco.html?bank_return=1'),700)}catch(e){msg.className='err';msg.textContent=e.message||'No pude terminar la conexión.'}})();</script></body></html>
